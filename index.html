<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Mode Synth Piano</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
            --white-key: #ffffff;
            --white-key-active: #b0bec5;
            --black-key: #303841;
            --black-key-active: #00adb5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Top Control Panel */
        .controls {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        select, button {
            background: #333;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
        }

        button:active, select:focus {
            border-color: var(--accent-color);
        }

        #start-btn {
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
            border: none;
        }

        /* Oscilloscope Visualizer */
        .visualizer-container {
            width: 100%;
            max-width: 900px;
            flex-grow: 1;
            margin: 20px 0;
            background: #000;
            border-radius: 12px;
            border: 1px solid #222;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Piano Keyboard */
        .keyboard {
            display: flex;
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 250px;
            background: #000;
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .key {
            position: relative;
            flex: 1;
            height: 100%;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
        }

        .key.white {
            background: var(--white-key);
            border: 1px solid #ccc;
            z-index: 1;
        }

        .key.white.active {
            background: var(--white-key-active);
            height: 99%;
        }

        .key.black {
            background: var(--black-key);
            height: 60%;
            width: 6%;
            margin-left: -3%;
            margin-right: -3%;
            z-index: 2;
            border-radius: 0 0 4px 4px;
        }

        .key.black.active {
            background: var(--black-key-active);
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label>Audio Initialization</label>
            <button id="start-btn">Start Audio Context</button>
        </div>
        <div class="control-group">
            <label>Waveform Type</label>
            <select id="waveform-select">
                <option value="sine">Sine</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
    </div>

    <div class="visualizer-container">
        <canvas id="oscilloscope"></canvas>
    </div>

    <div class="keyboard" id="keyboard">
        <!-- Piano Keys (1 Full Octave + C Crossover for demo) -->
        <div class="key white" data-note="261.63"></div> <!-- C4 -->
        <div class="key black" data-note="277.18"></div> <!-- C#4 -->
        <div class="key white" data-note="293.66"></div> <!-- D4 -->
        <div class="key black" data-note="311.13"></div> <!-- D#4 -->
        <div class="key white" data-note="329.63"></div> <!-- E4 -->
        <div class="key white" data-note="349.23"></div> <!-- F4 -->
        <div class="key black" data-note="369.99"></div> <!-- F#4 -->
        <div class="key white" data-note="392.00"></div> <!-- G4 -->
        <div class="key black" data-note="415.30"></div> <!-- G#4 -->
        <div class="key white" data-note="440.00"></div> <!-- A4 -->
        <div class="key black" data-note="466.16"></div> <!-- A#4 -->
        <div class="key white" data-note="493.88"></div> <!-- B4 -->
        <div class="key white" data-note="523.25"></div> <!-- C5 -->
    </div>

    <script>
        // Audio Setup
        let audioCtx = null;
        let analyser = null;
        let currentWaveform = 'sine';
        const activeOscillators = {};

        const startBtn = document.getElementById('start-btn');
        const waveformSelect = document.getElementById('waveform-select');
        const keyboard = document.getElementById('keyboard');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Initialize Web Audio
        startBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.connect(audioCtx.destination);
                startBtn.textContent = "Audio Active";
                startBtn.style.background = "#28a745";
                drawVisualizer();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        waveformSelect.addEventListener('change', (e) => {
            currentWaveform = e.target.value;
        });

        // Play Note function
        function playNote(frequency) {
            if (!audioCtx) return;
            
            // If already playing, do nothing
            if (activeOscillators[frequency]) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = currentWaveform;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Soft envelope to prevent severe clicks
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);

            osc.connect(gainNode);
            gainNode.connect(analyser);
            osc.start();

            activeOscillators[frequency] = { osc, gainNode };
        }

        // Stop Note function
        function stopNote(frequency) {
            if (activeOscillators[frequency]) {
                const { osc, gainNode } = activeOscillators[frequency];
                
                // Release tail to smooth out audio cutoff
                gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                
                setTimeout(() => {
                    osc.stop();
                    osc.disconnect();
                    gainNode.disconnect();
                }, 50);

                delete activeOscillators[frequency];
            }
        }

        // Touch & Mouse Handling for iPad compatibility
        function handleKeyStart(e) {
            e.preventDefault();
            const target = e.target;
            if (target.classList.contains('key')) {
                const freq = target.getAttribute('data-note');
                target.classList.add('active');
                playNote(parseFloat(freq));
            }
        }

        function handleKeyEnd(e) {
            e.preventDefault();
            const target = e.target;
            if (target.classList.contains('key')) {
                const freq = target.getAttribute('data-note');
                target.classList.remove('active');
                stopNote(parseFloat(freq));
            }
        }

        // Multi-touch safe event handling
        keyboard.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if(element) handleKeyStart({ preventDefault: () => {}, target: element });
        }, { passive: false });

        keyboard.addEventListener('touchend', (e) => {
            const touch = e.changedTouches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if(element) handleKeyEnd({ preventDefault: () => {}, target: element });
            }, { passive: false });
// Desktop fallbacks for testing
keyboard.addEventListener('mousedown', handleKeyStart);
keyboard.addEventListener('mouseup', handleKeyEnd);
keyboard.addEventListener('mouseleave', handleKeyEnd);
// Oscilloscope Draw Loop
function drawVisualizer() {
requestAnimationFrame(drawVisualizer);
if (!analyser) return;
const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);
analyser.getByteTimeDomainData(dataArray);
canvasCtx.fillStyle = '#121212';
canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
canvasCtx.lineWidth = 3;
canvasCtx.strokeStyle = '#00adb5';
canvasCtx.beginPath();
const sliceWidth = canvas.width / bufferLength;
let x = 0;
for (let i = 0; i < bufferLength; i++) {
const v = dataArray[i] / 128.0;
const y = (v * canvas.height) / 2;
if (i === 0) {
canvasCtx.moveTo(x, y);
} else {
canvasCtx.lineTo(x, y);
}
x += sliceWidth;
}
canvasCtx.lineTo(canvas.width, canvas.height / 2);
canvasCtx.stroke();
}
